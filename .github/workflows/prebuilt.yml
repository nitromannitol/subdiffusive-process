name: Comparator inputs

# Publishes the prebuilt inputs of the comparator workflow (CI_ARTIFACTS.md) for the checked-out
# commit from the build that the CI workflow (`build.yml`) made of that same commit. It restores
# the Mathlib cache, the dependency build and the project build saved by CI under this commit's
# key, requires the restored tree to be complete (`lake build --no-build` compiles nothing and
# fails on any out-of-date module), packs it with `scripts/prebuilt_artifacts.py create`, and
# uploads `manifest-<commit>.json` and the archive chunks to the release whose tag
# `.github/prebuilt.json` records. Existing assets are never replaced. The last step prints the
# SHA-256 of the manifest, the input of the comparator workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Pack the CI build of this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      - name: Restore the dependency build of CI
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          fail-on-cache-miss: true

      # The exact key of this commit only: the build that CI made and checked for this commit.
      - name: Restore the project build of CI for this commit
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Require a complete build
        run: lake build --no-build SubdiffusiveProcess @CoarseGraining @MarkovProcess

      - name: Pack the inputs
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y zstd; }
          python3 scripts/prebuilt_artifacts.py create --root . \
            --project-build .lake/build --packages .lake/packages --output "$RUNNER_TEMP/prebuilt"
          cp "$RUNNER_TEMP/prebuilt/manifest.json" "$RUNNER_TEMP/prebuilt/manifest-${GITHUB_SHA}.json"
          df -h /

      - name: Upload the manifest and the chunks to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open(".github/prebuilt.json"))["tag"])')
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Comparator build inputs ${tag#ci-prebuilt-}" \
              --notes "Source-bound build transport for independent kernel replay (CI_ARTIFACTS.md)."
          fi
          existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qxF "manifest-${GITHUB_SHA}.json" <<<"$existing"; then
            echo "manifest-${GITHUB_SHA}.json is already an asset of $tag; nothing is uploaded."
            exit 0
          fi
          cd "$RUNNER_TEMP/prebuilt"
          # Chunks already in the release belong to an earlier manifest of the same sources. They are
          # reused only if they are byte for byte the chunks of this manifest.
          other=$(grep -m1 '^manifest-.*\.json$' <<<"$existing" || true)
          if [ -n "$other" ]; then
            mkdir -p "$RUNNER_TEMP/other"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/other" --pattern "$other"
            python3 - "$RUNNER_TEMP/other/$other" manifest.json <<'PYSAME'
          import json, sys
          old, new = (json.load(open(path))['chunks'] for path in sys.argv[1:])
          if old != new:
              raise SystemExit('The release holds the chunks of a different build; record a new tag in .github/prebuilt.json.')
          print('The chunks in the release are those of this manifest.')
          PYSAME
            gh release upload "$tag" "manifest-${GITHUB_SHA}.json" --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$tag" "manifest-${GITHUB_SHA}.json" prebuilt.tar.zst.part* --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify the release assets against the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open(".github/prebuilt.json"))["tag"])')
          mkdir -p "$RUNNER_TEMP/check"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/check" \
            --pattern "manifest-${GITHUB_SHA}.json"
          python3 - "$RUNNER_TEMP/check/manifest-${GITHUB_SHA}.json" "$tag" <<'PYCHECK'
          import json, os, subprocess, sys
          manifest = json.load(open(sys.argv[1]))
          assets = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', sys.argv[2], '--repo', os.environ['GITHUB_REPOSITORY'],
               '--json', 'assets'], text=True))['assets']
          sizes = {a['name']: a['size'] for a in assets}
          for chunk in manifest['chunks']:
              if sizes.get(chunk['name']) != chunk['size']:
                  raise SystemExit('Release asset differs from the manifest: ' + chunk['name'])
          print('Every chunk of the manifest is a release asset of the recorded size.')
          PYCHECK
          echo "artifact_manifest_sha256: $(sha256sum "$RUNNER_TEMP/check/manifest-${GITHUB_SHA}.json" | cut -d' ' -f1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
