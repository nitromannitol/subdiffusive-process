name: Palomar comparator audit

permissions:
  contents: read

# Runs on GitHub-hosted runners (`ubuntu-latest`: 4 vCPU, 16 GB RAM, 6 h per
# job).  No `pull_request` trigger: a fork's pull request would run with this
# repository's Actions cache in scope, and the cached `.lake` trees are the
# artifacts every later gate trusts.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — the two source dependencies.
  #
  # Mathlib ships prebuilt oleans (`lake exe cache get`); CoarseGraining and
  # MarkovProcess do not, so they are compiled here once per
  # (`lean-toolchain`, `lake-manifest.json`) pair and cached.  Splitting them
  # off gives the dependency build and the project build a six-hour budget
  # each instead of one shared budget.
  # ---------------------------------------------------------------------------
  deps:
    name: Dependency oleans
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable read access to pinned private dependencies
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Set the DEPENDENCY_READ_TOKEN Actions secret with read access to CoarseGraining and MarkovProcess.' >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com

      - name: Reclaim runner disk space
        shell: bash
        run: |
          # Retain the hosted tool cache needed by setup-go.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          # Swap provides a backstop for large Lean modules.
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      # Installs the toolchain named in `lean-toolchain`, materialises every
      # package in `lake-manifest.json` (so the dependency working trees exist
      # before the cache is unpacked into them) and downloads the Mathlib
      # oleans.
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      - name: Restore the dependency build cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # Always run, cache hit or miss: on a hit this is a hash check of the
      # dependency sources that costs under a minute and proves the restored
      # tree is complete, and on a partial restore it finishes the job.
      - name: Build the dependency packages
        shell: bash
        run: |
          mkdir -p .lake
          python3 -u - <<'PY_CLEANUP' > .lake/compiler-input-cleanup.log 2>&1 &
          import pathlib, time
          removed = 0
          while True:
              for setup in pathlib.Path('.lake').rglob('*.setup.json'):
                  output = setup.with_name(setup.name.removesuffix('.setup.json') + '.c')
                  try:
                      if output.is_file() and output.stat().st_mtime_ns >= setup.stat().st_mtime_ns:
                          setup.unlink()
                          removed += 1
                  except FileNotFoundError:
                      pass
              print(f'Consumed compiler setup inputs removed: {removed}', flush=True)
              time.sleep(10)
          PY_CLEANUP
          cleanup_pid=$!
          trap 'kill "$cleanup_pid" 2>/dev/null || true' EXIT
          lake build @CoarseGraining @MarkovProcess

      # Saved only when the build above succeeded and the cache had missed, so
      # a failed run can never bank a partial tree under the stable key and
      # have the next run treat it as complete.
      - name: Save the dependency build cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

  # ---------------------------------------------------------------------------
  # Job 2 — the project itself.
  # ---------------------------------------------------------------------------
  comparator:
    name: Bundled Lean, NanoDa and con-ron checks
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enable read access to pinned private dependencies
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Set the DEPENDENCY_READ_TOKEN Actions secret with read access to CoarseGraining and MarkovProcess.' >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com

      - name: Reclaim runner disk space
        shell: bash
        run: |
          # Retain the hosted tool cache needed by setup-go.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enlarge swap
        shell: bash
        run: |
          # Swap provides a backstop for large Lean modules.
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/lean-swapfile"
          sudo fallocate -l 16G "$swapdir/lean-swapfile"
          sudo chmod 600 "$swapdir/lean-swapfile"
          sudo mkswap "$swapdir/lean-swapfile"
          sudo swapon "$swapdir/lean-swapfile"
          free -h

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
      - name: Restore dependency build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/CoarseGraining/.lake/build
            .lake/packages/MarkovProcess/.lake/build
          key: lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore project build artifacts
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Raise the exporter memory-mapping limit
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run every bundled comparator pair
        shell: bash
        run: |
          mkdir -p .lake
          python3 -u - <<'PY_CLEANUP' > .lake/compiler-input-cleanup.log 2>&1 &
          import pathlib, time
          removed = 0
          while True:
              for setup in pathlib.Path('.lake').rglob('*.setup.json'):
                  output = setup.with_name(setup.name.removesuffix('.setup.json') + '.c')
                  try:
                      if output.is_file() and output.stat().st_mtime_ns >= setup.stat().st_mtime_ns:
                          setup.unlink()
                          removed += 1
                  except FileNotFoundError:
                      pass
              print(f'Consumed compiler setup inputs removed: {removed}', flush=True)
              time.sleep(10)
          PY_CLEANUP
          cleanup_pid=$!
          trap 'kill "$cleanup_pid" 2>/dev/null || true' EXIT
          ./scripts/run_comparators.sh --palomar
      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palomar-comparator-logs
          path: .lake/comparator-logs/palomar/*.log
