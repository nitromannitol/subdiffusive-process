        - "claude-sonnet-5-5"
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Proof development, review and release preparation with Lean builds under
        leanprover/lean4:v4.35.0-rc2 with Mathlib at the same version, and the public
        CoarseGraining and MarkovProcess libraries at pinned revisions.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work on author-specified statements. The formal statements follow
        the paper; deviations are listed under fidelity.divergences.
    - method: "agent"
      models:
        - "gpt-5.6-luna"
        - "gpt-6.1-sol"
      framework: "Codex (OpenAI)"
      tool_setup: >-
        Lean proof development, porting to the module system and the pinned toolchain,
        and release preparation under the same toolchain and dependency pins.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work; each task fixed the statements to be proved and forbade
        changing them.
    - method: "agent"
      models:
        - "deepseek-v4.1-flash"
        - "leanstral"
      framework: "API-hosted models driven by project scripts"
      tool_setup: >-
        Auxiliary proof search, small typed proof obligations and independent
        read-only checks of statements against the paper.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
  spend_usd: "not tracked"
  notes: >-
    The Lean code was written with AI assistance under the direction of the authors, who
    fixed the statements to be formalized. Every proof is checked by the Lean kernel and
    Mathlib, and the library contains no sorry and no custom axiom. The three Mathlib-only
    comparator challenge files (SubdiffusiveProcessAudit/*/Challenge.lean) each contain
    exactly one intentional statement-level sorry, which the corresponding Solution.lean
    proves and leanprover/comparator checks. The model versions listed above are the
    ones recorded during the work; wall time and spend were not tracked.

fidelity:
  divergences: >-
    The results are conditional on a supplied model: every theorem is stated for an
    arbitrary GMCModel (the paper's assumptions g1-g4 with independent layers) in
    dimension at least two, and the existence of such a model at arbitrarily small
    disorder is not formalized; the constructor
    SubdiffusiveProcess.Model.nonempty_gmcModel_of_zeroLevelLaw needs a supplied
    zero-level law. Theorems A and C hold for disorder at most a threshold depending on
    the dimension, Theorem B(1) for disorder at most a threshold depending on the exponent,
    the moment order and the dimension, and Theorem B(2) throughout the model's own range.
    Local C^{1,1} regularity is part of the type of a potential, so it holds for every
    sample. The formal process is the continuous Feller diffusion constructed from weak
    elliptic resolvents and described by its analytic path laws; the identification with
    the solution of the stochastic differential equation is proved in the paper only.
    Theorem A uses versions defined in every environment (the limiting kernel is a
    constant-path law, and a cutoff semigroup is the identity, outside a probability-one
    event) with the paper's order of quantifiers. The cutoff process of index 0 is
    clock-normalized by the factor ahom_0, which the physical time factor cancels. Cubes
    use the sup norm and energies the Euclidean norm. Theorem B uses volume-normalized
    componentwise duals of H^1_0 as negative norms and the sum of the L2 sizes of a
    function, its gradient and its Hessian as the H^2 norm, and defines ahom_m as the
    infimum over cube scales of the normalized trace of the expected coarse-grained matrix,
    which equals the paper's limit because the sequence is nonincreasing. Theorem C gives
    large-scale estimates above a random minimal scale and a Liouville theorem whose
    conclusion is a constant continuous representative; it makes no claim about pointwise
    Hölder regularity at microscopic scales. Real-valued definitions are total (division
    by zero, Real.log 0, non-integrable integrals, non-summable series, ENNReal.toReal of
    infinity and empty suprema all take conventional values), so analytic conclusions come
    with the positivity, finiteness and integrability hypotheses stated in the
    declarations. Some statements add explicit measurability or existence-and-uniqueness
    conclusions that the paper leaves implicit. Statements of the paper with no formal
    counterpart are marked Paper-only in CORRESPONDENCE.md; besides the stochastic
    differential equation identification they are: none.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    Every proof is checked by the Lean kernel and Mathlib, and the three headline
    statements are additionally replayed by independent kernels through
    leanprover/comparator. The formal statements were compared with the paper by
    AI-assisted reviews under the direction of the authors. This is not external peer
    review.

alignment:
  namespace: "SubdiffusiveProcess"
  statements:
    - source: "Theorem A (introduction, t.A)"
      lean: "SubdiffusiveProcess.process_convergence"
      module: "SubdiffusiveProcess.MainTheorems"
      status: "proved"
      note: "Comparator surface: SubdiffusiveProcessAudit/ProcessConvergence/."
    - source: "Theorem A, precise form (t.scaling.limit)"
      lean: "SubdiffusiveProcess.process_convergence_precise"
      module: "SubdiffusiveProcess.MainTheorems"
      status: "proved"
      note: "Quenched form from which Theorem A follows; its own axiom report, no separate comparator pair."
    - source: "Theorem B (t.B)"
      lean: "SubdiffusiveProcess.quantitative_homogenization"
      module: "SubdiffusiveProcess.MainTheorems"
      status: "proved"
      note: "Comparator surface: SubdiffusiveProcessAudit/QuantitativeHomogenization/."
    - source: "Theorem C (t.C)"
      lean: "SubdiffusiveProcess.anomalous_holder_regularity"
      module: "SubdiffusiveProcess.MainTheorems"
      status: "proved"
      note: "Comparator surface: SubdiffusiveProcessAudit/AnomalousHolderRegularity/."
    - source: "All numbered statements of the paper"
      lean: "see CORRESPONDENCE.md"
      module: "SubdiffusiveProcess.Paper"
      status: "mapped"
      note: "CORRESPONDENCE.md lists every statement of the paper with its declaration, or marks it Paper-only."

acknowledgements: >-
  Built on Lean 4, Mathlib, Lake, the CoarseGraining and MarkovProcess libraries,
  leanprover/comparator, NanoDa and con-ron.
