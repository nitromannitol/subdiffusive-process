version: v0.4
project:
  name: subdiffusive-process
  description: A Lean 4 formalization of the scaling limit of a Brownian particle in a log-correlated
    potential, quantitative homogenization of its elliptic operator and anomalous Hölder regularity. The
    development builds on Mathlib, CoarseGraining and MarkovProcess.
  authors:
  - Scott Armstrong
  - Ahmed Bou-Rabee
  - Tuomo Kuusi
  license: Apache-2.0
  responsible_maintainers:
  - Scott Armstrong
classification:
  arxiv:
  - math.PR
  - math.AP
  msc2020:
  - 60K37
  - 35R60
  - 82B28
sources:
- title: Anomalous scaling limit of a Brownian particle in a log-correlated potential
  authors:
  - Scott Armstrong
  - Ahmed Bou-Rabee
  - Tuomo Kuusi
  type: paper
  relationship: formalizes
  location: paper/
  note: Author-authorized live paper sources, bibliography, figures and rebuilt PDF, pinned to 9860ff1b02fbf478b44b7bb7f0482094e4792840.
    Labels were checked against that snapshot.
  license: unknown
  author_endorsement: participated
