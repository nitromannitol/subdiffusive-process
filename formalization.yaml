version: "v0.4"

project:
  name: "subdiffusive-process"
  description: >-
    A Lean 4 formalization of the paper "Anomalous scaling limit of a Brownian
    particle in a log-correlated potential" by Armstrong, Bou-Rabee and Kuusi: the
    subdiffusive scaling limit of a Brownian particle whose drift is the gradient of
    a log-correlated random potential (Theorem A, in its introduction form and in its
    precise quenched form), quantitative homogenization of the Dirichlet problem
    uniformly in the infrared cutoff (Theorem B), and large-scale Hölder regularity
    with a Liouville theorem (Theorem C), together with the supporting coarse-graining,
    elliptic-regularity and Markov-process theory. The theorems hold for every random
    environment satisfying the paper's standing assumptions (a GMCModel); the
    existence of such an environment at arbitrarily small disorder is not formalized.
    The development builds on Mathlib and on the public CoarseGraining and
    MarkovProcess libraries. The three headline theorems are independently checked by
    the comparator pairs under SubdiffusiveProcessAudit/.
  authors:
    - "Scott Armstrong"
    - "Ahmed Bou-Rabee"
    - "Tuomo Kuusi"
  responsible_maintainers:
    - "Scott Armstrong"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.AP"]
  msc2020: ["60K37", "35R60", "82B28"]

sources:
  - title: "Anomalous scaling limit of a Brownian particle in a log-correlated potential"
    authors:
      - "Scott Armstrong"
      - "Ahmed Bou-Rabee"
      - "Tuomo Kuusi"
    type: "paper"
    relationship: "formalizes"
    location: "paper/"
    note: >-
      The paper under formalization, preprint forthcoming. Its source, bibliography,
      figures and compiled PDF are included under paper/, pinned to 6a8660ea9343a5902485e18b40b66b5f16e4d7e2;
      CORRESPONDENCE.md maps the statements of that version to Lean declarations, and
      its labels were checked against that version. Theorems A, B and C of the
      introduction are formalized as stated there.
    license: "authors' copyright; included with the authors' permission, publication licence not yet chosen"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/scottnarmstrong/CoarseGraining"
    relationship: "builds-on"
    note: >-
      Scott Armstrong and Tuomo Kuusi, CoarseGraining (public Lean library of
      homogenization theory), a git dependency pinned to commit
      df82db0a9e5ff2c11c5c6faa2777fd83bfdbb013.
  - id: "https://github.com/scottnarmstrong/MarkovProcess"
    relationship: "builds-on"
    note: >-
      Scott Armstrong, MarkovProcess (public Lean library of continuous-time Markov
      processes and Feller semigroups), a git dependency pinned to commit
      814b0f8820c2da712eb79574ea7ca3be8db4b69d.

status:
  scope: >-
    Theorem A of the introduction (SubdiffusiveProcess.process_convergence) and its
    precise quenched form (SubdiffusiveProcess.process_convergence_precise), Theorem B
    (SubdiffusiveProcess.quantitative_homogenization) and Theorem C
    (SubdiffusiveProcess.anomalous_holder_regularity), each for every GMCModel in
    dimension at least two at the disorder strength stated in the theorem, together
    with the supporting results of the paper. CORRESPONDENCE.md maps the statements of the
    paper to Lean declarations and marks those that have no formal counterpart. Not
    formalized: the existence of a GMCModel at arbitrarily small disorder (the
    constructor is conditional on a supplied zero-level law) and the identification of
    the diffusion with the solution of the stochastic differential equation.
  sorry_count: 0
  sorry_count_scope: "SubdiffusiveProcess library only"
  comparator_challenge_sorry_count: 3
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "SubdiffusiveProcess.process_convergence"
      file: "SubdiffusiveProcess/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SubdiffusiveProcessAudit/ProcessConvergence/comparator.json"
      literature_dependencies: []
    - declaration: "SubdiffusiveProcess.process_convergence_precise"
      file: "SubdiffusiveProcess/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SubdiffusiveProcess.quantitative_homogenization"
      file: "SubdiffusiveProcess/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SubdiffusiveProcessAudit/QuantitativeHomogenization/comparator.json"
      literature_dependencies: []
    - declaration: "SubdiffusiveProcess.anomalous_holder_regularity"
      file: "SubdiffusiveProcess/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SubdiffusiveProcessAudit/AnomalousHolderRegularity/comparator.json"
      literature_dependencies: []

